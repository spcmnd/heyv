version: '3.1'

services:
  db:
    image: mysql
    command: --default-authentication-plugin=mysql_native_password
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: password1
    ports:
      - 3306:3306

  adminer:
    image: adminer
    restart: always
    ports:
      - 8080:8080
  
  api:
    build: server/
    environment:
      NODE_ENV: development
      PORT: 8000
      CORS_ORIGIN: http://localhost
    ports:
      - 8000:8000
  
  client:
    build: client/
    ports:
      - 80:80